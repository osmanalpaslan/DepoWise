app = "depowise-web"
primary_region = "fra"
# 2026-10-10: 256 MB makinede bellek dolunca süreç kilitleniyordu → takas alanı (ücretsiz) + .NET bellek tasarrufu.
# ⚠ Üst düzey anahtar: [bölüm] başlıklarından ÖNCE durmalı (altına yazılırsa o bölüme ait sayılır).
swap_size_mb = 256

[build]
  dockerfile = "Dockerfile.web"

[env]
  Api__BaseUrl = "https://depowise-erp.fly.dev"
  DOTNET_GCConserveMemory = "5"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[mounts]]
  source = "depowise_web_keys"
  destination = "/dpkeys"
