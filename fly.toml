app = "depowise-erp"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  DEPOWISE_SERVER_DATA = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  # ⭐ M-72 (AR-GE 2026-10-25, F-067): sağlık kontrolü — süreç kilitlenirse Fly makineyi kendisi yeniden başlatır (ADR-070 benzeri
  # uzun kesintiye karşı). /health yalnız sürecin ayakta olduğunu söyler; disk dolsa da 200 döner (yeniden başlatma diski boşaltmaz).
  # Etkisi bir sonraki API yayınında başlar (AR-GE süresince yayın yok).
  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/health"

[[mounts]]
  source = "depowise_data"
  destination = "/data"
